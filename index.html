<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>預約系統</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Noto Sans TC', -apple-system, sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ── 載入畫面 ── */
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .loading-card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 300px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }
    .loading-card h2 {
      font-size: 17px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
    }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto;
      border: 3px solid #eee; border-top-color: #06C755;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Cal.com embed 容器 ── */
    #cal-container {
      display: none;
      width: 100%;
      min-height: 100vh;
      overflow: auto;
    }

    /* ── 自訂預約成功畫面 ── */
    #success-screen {
      display: none;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f0;
      padding: 24px;
    }
    .success-card {
      background: white;
      padding: 48px 28px 36px;
      border-radius: 20px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .success-icon {
      width: 68px; height: 68px;
      margin: 0 auto 24px;
      background: #06C755;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .success-icon svg { width: 32px; height: 32px; }
    .success-card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
    }
    .success-card p {
      font-size: 15px;
      color: #666;
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .success-detail {
      font-size: 14px;
      color: #444;
      background: #f8f8f5;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 28px;
      text-align: left;
      line-height: 1.8;
    }
    .close-btn {
      display: inline-block;
      padding: 14px 48px;
      background: #06C755;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .close-btn:active { background: #05a648; }

    /* ── 錯誤畫面 ── */
    #error-screen {
      display: none;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .error-card {
      background: white;
      padding: 40px 28px;
      border-radius: 16px;
      text-align: center;
      max-width: 300px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }
    .error-card p {
      font-size: 15px;
      color: #666;
      margin-bottom: 20px;
    }
    .retry-btn {
      padding: 12px 36px;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 載入中 -->
  <div id="loading">
    <div class="loading-card">
      <h2>正在載入預約頁面…</h2>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Cal.com inline embed 渲染區 -->
  <div id="cal-container">
    <div id="my-cal-inline" style="width:100%;height:100%;overflow:scroll"></div>
  </div>

  <!-- 自訂預約成功畫面 -->
  <div id="success-screen">
    <div class="success-card">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2>預約成功 🎉</h2>
      <div id="booking-detail" class="success-detail" style="display:none;"></div>
      <p>
        感謝您的預約！<br>
        我們已收到您的資訊，<br>
        届時期待為您服務 💆
      </p>
      <button class="close-btn" onclick="closeWindow()">返回 LINE</button>
    </div>
  </div>

  <!-- 錯誤畫面 -->
  <div id="error-screen">
    <div class="error-card">
      <p>載入失敗，請重新嘗試</p>
      <button class="retry-btn" onclick="location.reload()">重試</button>
    </div>
  </div>

  <!-- ========================================
       Cal.com 官方 Embed Script（不是 iframe）
       ======================================== -->
  <script>
    (function (C, A, L) {
      let p = function (a, ar) { a.q.push(ar); };
      let d = C.document;
      C.Cal = C.Cal || function () {
        let cal = C.Cal;
        let ar = arguments;
        if (!cal.loaded) {
          cal.ns = {};
          cal.q = cal.q || [];
          d.head.appendChild(d.createElement("script")).src = A;
          cal.loaded = true;
        }
        if (ar[0] === L) {
          const api = function () { p(api, arguments); };
          const namespace = ar[1];
          api.q = api.q || [];
          if (typeof namespace === "string") {
            cal.ns[namespace] = cal.ns[namespace] || api;
            p(cal.ns[namespace], ar);
            p(cal, ["initNamespace", namespace]);
          } else p(cal, ar);
          return;
        }
        p(cal, ar);
      };
    })(window, "https://app.cal.com/embed/embed.js", "init");
  </script>

  <script>
    // =====================================================
    //  請修改以下兩個變數
    // =====================================================
    var LIFF_ID      = "2010006924-yy3gmsF5";
    var CAL_USERNAME = "tomisacat-eur7wq";
    // =====================================================

    var bookingHandled = false;

    async function init() {
      try {
        // ── 1. LIFF 初始化 ──
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // ── 2. 取得 LINE User ID ──
        var profile = await liff.getProfile();
        var lineUserId = profile.userId;

        // ── 3. 初始化 Cal.com embed ──
        Cal("init", { origin: "https://cal.com" });

        // ── 4. 載入 inline embed（帶 lineUserId） ──
        Cal("inline", {
          elementOrSelector: "#my-cal-inline",
          calLink: CAL_USERNAME + "?lineUserId=" + encodeURIComponent(lineUserId)
        });

        // ── 5. embed UI 設定 ──
        Cal("ui", {
          hideEventTypeDetails: false,
          layout: "month_view"
        });

        // ── 6. 監聽預約成功（新版事件名） ──
        Cal("on", {
          action: "bookingSuccessfulV2",
          callback: function (e) {
            if (!bookingHandled) {
              bookingHandled = true;
              showSuccess(e.detail.data);
            }
          }
        });

        // ── 7. 監聽預約成功（舊版事件名，相容用） ──
        Cal("on", {
          action: "bookingSuccessful",
          callback: function (e) {
            if (!bookingHandled) {
              bookingHandled = true;
              showSuccess(e.detail.data);
            }
          }
        });

        // ── 8. 切換畫面 ──
        document.getElementById("loading").style.display = "none";
        document.getElementById("cal-container").style.display = "block";

      } catch (err) {
        console.error("Init error:", err);
        document.getElementById("loading").style.display = "none";
        document.getElementById("error-screen").style.display = "flex";
      }
    }

    function showSuccess(data) {
      // 隱藏 Cal.com
      document.getElementById("cal-container").style.display = "none";

      // 顯示預約詳情（如果事件有帶資料）
      if (data) {
        var detailEl = document.getElementById("booking-detail");
        var lines = [];

        if (data.title) {
          lines.push("📋 " + data.title);
        }
        if (data.startTime) {
          try {
            var d = new Date(data.startTime);
            var formatted = d.getFullYear() + "-"
              + String(d.getMonth() + 1).padStart(2, "0") + "-"
              + String(d.getDate()).padStart(2, "0") + " "
              + String(d.getHours()).padStart(2, "0") + ":"
              + String(d.getMinutes()).padStart(2, "0");
            lines.push("📅 " + formatted);
          } catch (ignore) {}
        }
        if (data.endTime && data.startTime) {
          try {
            var start = new Date(data.startTime);
            var end = new Date(data.endTime);
            var mins = Math.round((end - start) / 60000);
            lines.push("⏱ " + mins + " 分鐘");
          } catch (ignore) {}
        }

        if (lines.length > 0) {
          detailEl.innerHTML = lines.join("<br>");
          detailEl.style.display = "block";
        }
      }

      // 顯示成功畫面
      document.getElementById("success-screen").style.display = "flex";

      // 按返回鍵 → 直接關閉回 LINE
      history.pushState(null, "", location.href);
      window.addEventListener("popstate", function () {
        closeWindow();
      });
    }

    function closeWindow() {
      if (typeof liff !== "undefined" && liff.isInClient()) {
        liff.closeWindow();
      } else {
        window.close();
      }
    }

    init();
  </script>
</body>
</html>
