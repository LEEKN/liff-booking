<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預約系統</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center;
           align-items: center; min-height: 100vh; background: #f0f4f8; }
    .card { background: white; padding: 40px; border-radius: 16px;
            text-align: center; max-width: 320px; }
    .spinner { width: 40px; height: 40px; margin: 16px auto;
               border: 3px solid #eee; border-top-color: #06C755;
               border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h2>正在載入預約頁面…</h2>
    <div class="spinner"></div>
  </div>
  <script>
    const LIFF_ID  = "2010006924-yy3gmsF5";
    const CAL_URL  = "https://cal.com/tomisacat-eur7wq";

    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        const profile = await liff.getProfile();
        const url = `${CAL_URL}?lineUserId=${encodeURIComponent(profile.userId)}`;

        // ✅ 改用 replace，Cal.com 成為 WebView 的 History 起點
        window.location.replace(url);
      } catch (err) {
        document.body.innerHTML = "<div class='card'>載入失敗，請重試</div>";
      }
    }
    init();
  </script>
</body>
</html>
