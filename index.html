<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>線上預約</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & 根變數 ── */
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --matcha:      #6b8f5e;   /* 主色：抹茶綠 */
      --matcha-dark: #4f6b44;   /* 深抹茶（按鈕 hover） */
      --matcha-mid:  #8aab7a;   /* 中抹茶（選取框線） */
      --matcha-pale: #d4e5cc;   /* 淺抹茶（選取背景） */
      --matcha-bg:   #eef4ea;   /* 超淺（頁面背景） */
      --milk:        #faf9f5;   /* 牛奶白（卡片背景） */
      --milk-deep:   #f0ede5;   /* 深牛奶（分隔區塊） */
      --ink:         #1e1e1e;   /* 主文字 */
      --ink-mid:     #555;      /* 次文字 */
      --ink-light:   #999;      /* 提示文字 */
      --border:      #ddd8ce;   /* 常規框線 */
      --radius-sm:   8px;
      --radius-md:   14px;
      --radius-lg:   20px;
      --shadow-sm:   0 2px 8px rgba(0,0,0,0.07);
      --shadow-md:   0 4px 20px rgba(0,0,0,0.1);
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, sans-serif;
      background: var(--matcha-bg);
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ══════════════════════════════════════
       載入畫面
    ══════════════════════════════════════ */
    #screen-loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      gap: 20px;
    }
    .loading-logo {
      width: 60px; height: 60px;
      background: var(--matcha);
      border-radius: 18px;
      display: flex; justify-content: center; align-items: center;
    }
    .loading-logo svg { width: 34px; height: 34px; }
    .loading-label {
      font-size: 15px;
      color: var(--ink-mid);
      font-weight: 500;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--matcha-pale);
      border-top-color: var(--matcha);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ══════════════════════════════════════
       主預約流程畫面
    ══════════════════════════════════════ */
    #screen-booking {
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── 頂部 Header ── */
    .app-header {
      background: var(--milk);
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .app-header-inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      width: 36px; height: 36px;
      background: var(--matcha);
      border-radius: 10px;
      display: flex; justify-content: center; align-items: center;
      flex-shrink: 0;
    }
    .header-logo svg { width: 20px; height: 20px; }
    .header-text h1 {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
    }
    .header-text p {
      font-size: 12px;
      color: var(--ink-light);
      margin-top: 2px;
    }

    /* ── 步驟指示器 ── */
    .step-indicator {
      display: flex;
      align-items: center;
      padding: 16px 20px 0;
      gap: 0;
    }
    .step-dot {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 12px;
      font-weight: 700;
      background: var(--milk-deep);
      color: var(--ink-light);
      border: 2px solid var(--border);
      transition: all 0.25s;
      flex-shrink: 0;
    }
    .step-dot.active {
      background: var(--matcha);
      color: white;
      border-color: var(--matcha);
    }
    .step-dot.done {
      background: var(--matcha-pale);
      color: var(--matcha-dark);
      border-color: var(--matcha-mid);
    }
    .step-line {
      flex: 1;
      height: 2px;
      background: var(--border);
      transition: background 0.25s;
    }
    .step-line.done { background: var(--matcha-mid); }
    .step-labels {
      display: flex;
      justify-content: space-between;
      padding: 6px 20px 16px;
    }
    .step-label {
      font-size: 11px;
      color: var(--ink-light);
      flex: 1;
      text-align: center;
    }
    .step-label:first-child { text-align: left; }
    .step-label:last-child { text-align: right; }
    .step-label.active { color: var(--matcha); font-weight: 600; }

    /* ── 內容區 ── */
    .booking-content {
      flex: 1;
      padding: 0 16px 32px;
      overflow-y: auto;
    }

    /* ── 區塊卡片 ── */
    .section-card {
      background: var(--milk);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-mid);
      letter-spacing: 0.5px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--milk-deep);
      text-transform: uppercase;
    }

    /* ══ 步驟一：方案選擇 ══ */

    .plan-list { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .plan-item {
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      background: var(--matcha-bg);
      padding: 14px 14px 12px;
      cursor: pointer;
      transition: all 0.18s;
      position: relative;
    }
    .plan-item:active { transform: scale(0.98); }
    .plan-item.selected {
      border-color: var(--matcha);
      background: var(--matcha-pale);
    }
    .plan-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    .plan-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }
    .plan-duration {
      font-size: 12px;
      background: var(--milk);
      color: var(--matcha-dark);
      border: 1px solid var(--matcha-pale);
      border-radius: 20px;
      padding: 3px 10px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .plan-desc {
      font-size: 13px;
      color: var(--ink-mid);
      line-height: 1.5;
    }
    .plan-check {
      position: absolute;
      top: 12px; right: 12px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--matcha);
      display: none;
      justify-content: center;
      align-items: center;
    }
    .plan-item.selected .plan-check { display: flex; }
    .plan-item.selected .plan-duration { display: none; }

    .plan-price {
      display: inline-block;
      margin-left: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--matcha-dark);
    }

    /* ── 加購區塊 ── */
    .addon-area {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--matcha-mid);
    }
    .addon-label {
      font-size: 12px;
      color: var(--ink-mid);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .addon-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--milk);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s;
    }
    .addon-btn:last-child { margin-bottom: 0; }
    .addon-btn:active { transform: scale(0.98); }
    .addon-btn.selected {
      border-color: var(--matcha);
      background: var(--matcha-pale);
      color: var(--matcha-dark);
    }
    .addon-btn-check {
      width: 18px; height: 18px;
      border-radius: 5px;
      border: 1.5px solid var(--border);
      background: white;
      flex-shrink: 0;
      position: relative;
      transition: all 0.15s;
    }
    .addon-btn.selected .addon-btn-check {
      background: var(--matcha);
      border-color: var(--matcha);
    }
    .addon-btn.selected .addon-btn-check::after {
      content: '';
      position: absolute;
      left: 5px; top: 2px;
      width: 5px; height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .addon-btn-name { flex: 1; }
    .addon-btn-meta {
      font-size: 12px;
      color: var(--ink-light);
      font-weight: 600;
    }
    .addon-btn.selected .addon-btn-meta { color: var(--matcha-dark); }

    .addon-total {
      margin-top: 10px;
      padding: 8px 12px;
      background: var(--matcha-pale);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      color: var(--matcha-dark);
      text-align: center;
    }
    .addon-total:empty { display: none; }

    .addon-notes {
      margin-top: 8px;
      display: none;
    }
    .addon-note-line {
      font-size: 12px;
      color: var(--ink-mid);
      line-height: 1.6;
      padding: 4px 0;
    }
    .plan-check svg { width: 12px; height: 12px; }

    /* ══ 步驟二：日期與時段 ══ */
    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
    }
    .cal-nav-btn {
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--milk);
      cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      color: var(--ink-mid);
      font-size: 18px;
      transition: all 0.15s;
    }
    .cal-nav-btn:active { background: var(--matcha-pale); border-color: var(--matcha-mid); }
    .cal-nav-btn:disabled { opacity: 0.3; cursor: default; }
    .cal-month-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 0 10px;
      margin-bottom: 4px;
    }
    .cal-weekday {
      text-align: center;
      font-size: 11px;
      color: var(--ink-light);
      font-weight: 600;
      padding: 4px 0;
    }
    .cal-weekday.sun { color: #d04040; }
    .cal-weekday.sat { color: #4060c0; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 0 10px 10px;
    }
    .cal-day {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: 2px solid transparent;
      color: var(--ink);
      position: relative;
    }
    .cal-day.empty { cursor: default; }
    .cal-day.past {
      color: var(--ink-light);
      cursor: default;
      pointer-events: none;
    }
    .cal-day.no-slot {
      color: var(--ink-light);
      cursor: default;
      pointer-events: none;
    }
    .cal-day.has-slot {
      background: var(--matcha-bg);
      cursor: pointer;
    }
    .cal-day.has-slot:active { transform: scale(0.92); }
    .cal-day.selected {
      background: var(--matcha);
      color: white;
      border-color: var(--matcha-dark);
    }
    .cal-day.today:not(.selected)::after {
      content: '';
      position: absolute;
      bottom: 3px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--matcha);
    }
    .cal-loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 20px;
      color: var(--ink-light);
      font-size: 13px;
    }
    .cal-sunday { color: #d04040; }
    .cal-saturday { color: #4060c0; }

    /* 時段列表 */
    .slot-section {
      border-top: 1px solid var(--border);
      padding: 14px;
    }
    .slot-section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-mid);
      margin-bottom: 10px;
    }
    .slot-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .slot-btn {
      padding: 10px 6px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--milk);
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s;
    }
    .slot-btn:active { transform: scale(0.95); }
    .slot-btn.selected {
      border-color: var(--matcha);
      background: var(--matcha);
      color: white;
    }
    .slot-empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--ink-light);
      font-size: 13px;
      padding: 16px 0;
    }

    /* ══ 步驟三：填寫資料 ══ */
    .form-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .form-row { display: flex; flex-direction: column; gap: 6px; }
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-mid);
    }
    .form-label span { color: #d04040; margin-left: 2px; }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--matcha-bg);
      font-family: inherit;
      font-size: 15px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .form-input:focus { border-color: var(--matcha); background: white; }
    .form-input::placeholder { color: var(--ink-light); }
    .form-hint {
      font-size: 12px;
      color: var(--ink-light);
    }

    /* 預約摘要 */
    .booking-summary {
      background: var(--matcha-pale);
      border: 1.5px solid var(--matcha-mid);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin: 0 16px 16px;
    }
    .summary-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--matcha-dark);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .summary-row {
      display: flex;
      gap: 8px;
      font-size: 13px;
      color: var(--matcha-dark);
      margin-bottom: 4px;
    }
    .summary-row:last-child { margin-bottom: 0; }
    .summary-icon { flex-shrink: 0; width: 16px; text-align: center; }

    /* ── 底部按鈕區 ── */
    .btn-area {
      padding: 14px 16px;
      background: var(--milk);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }
    .btn-back {
      flex: 0 0 auto;
      padding: 14px 20px;
      background: var(--milk);
      color: var(--ink-mid);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-back:active { background: var(--milk-deep); }
    .btn-next {
      flex: 1;
      padding: 14px;
      background: var(--matcha);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-next:active { background: var(--matcha-dark); }
    .btn-next:disabled {
      background: var(--matcha-pale);
      color: var(--matcha-mid);
      cursor: default;
    }
    .btn-next .btn-spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-next.loading .btn-spinner { display: block; }
    .btn-next.loading .btn-text { display: none; }

    /* ══════════════════════════════════════
       預約成功畫面
    ══════════════════════════════════════ */
    #screen-success {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 32px 20px;
      background: var(--matcha-bg);
    }
    .success-card {
      background: var(--milk);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 40px 24px 32px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }
    .success-icon-wrap {
      width: 72px; height: 72px;
      margin: 0 auto 24px;
      background: var(--matcha);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .success-icon-wrap svg { width: 34px; height: 34px; }
    .success-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 10px;
    }
    .success-msg {
      font-size: 14px;
      color: var(--ink-mid);
      line-height: 1.8;
      margin-bottom: 24px;
    }
    .success-detail-box {
      background: var(--matcha-pale);
      border: 1px solid var(--matcha-mid);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      text-align: left;
      margin-bottom: 28px;
    }
    .success-detail-row {
      display: flex;
      gap: 10px;
      font-size: 14px;
      color: var(--matcha-dark);
      margin-bottom: 6px;
      line-height: 1.5;
    }
    .success-detail-row:last-child { margin-bottom: 0; }
    .success-detail-icon { flex-shrink: 0; }
    .btn-close {
      display: block;
      width: 100%;
      padding: 15px;
      background: var(--matcha);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-close:active { background: var(--matcha-dark); }

    /* ══════════════════════════════════════
       錯誤畫面
    ══════════════════════════════════════ */
    #screen-error {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .error-card {
      background: var(--milk);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      padding: 32px 24px;
      text-align: center;
      max-width: 320px;
      width: 100%;
    }
    .error-icon { font-size: 40px; margin-bottom: 16px; }
    .error-msg {
      font-size: 15px;
      color: var(--ink-mid);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .btn-retry {
      padding: 12px 36px;
      background: var(--ink);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════
     載入畫面
══════════════════════════════════════ -->

<script>
/* ======================================================
   ★ 請修改以下設定
   ====================================================== */
var LIFF_ID    = "2010006924-yy3gmsF5";       // 第 9 節取得的 LIFF ID
var API_BASE   = "";                   // 留空 = 使用相對路徑（部署在同一個 Vercel 專案）
                                       // 若獨立部署，填入 Vercel Function URL，例如 https://xxx.vercel.app
/* ====================================================== */

/* ── 狀態 ── */
var state = {
  step: 1,
  lineUserId: "",
  eventTypes: [],
  selectedPlan: null,        // 目前選定的方案
  selectedAddons: [],        // 已勾選的加購 [{name, minutes, price, note}]
  realUsername: "",
  calendarYear: 0,
  calendarMonth: 0,          // 0-based
  slotsCache: {},            // "YYYY-MM" → { "YYYY-MM-DD": ["HH:mm", ...] }
  calendarDays: [],          // 渲染用
  selectedDate: "",          // "YYYY-MM-DD"
  selectedSlot: "",          // "HH:mm"
  selectedSlotIso: ""        // ISO 完整時間字串
};

var TODAY = new Date();
TODAY.setHours(0,0,0,0);

/* ── API 呼叫 ── */
async function apiGet(params) {
  var qs = Object.entries(params).map(([k,v]) => k + "=" + encodeURIComponent(v)).join("&");
  var r = await fetch((API_BASE || "") + "/api/cal?" + qs);
  if (!r.ok) throw new Error("API error " + r.status);
  return r.json();
}
async function apiPost(body) {
  var r = await fetch((API_BASE || "") + "/api/cal", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  var data = await r.json();
  if (!r.ok) throw new Error(JSON.stringify(data));
  return data;
}

/* ── 訪客點擊追蹤（fire-and-forget，不阻塞流程、失敗不影響預約）── */
function trackClick(action, itemName, planName) {
  try {
    fetch((API_BASE || "") + "/api/track", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        lineUserId: state.lineUserId || "",
        sessionId: state.sessionId || "",
        action: action,
        itemName: itemName || "",
        planName: planName || ""
      })
    }).catch(function() {});   // 失敗靜默，不影響使用者
  } catch (e) {}
}

/* ── 初始化 ── */
async function init() {
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) { liff.login(); return; }
  var profile = await liff.getProfile();
  state.lineUserId = profile.userId;
  // 產生本次造訪的 session id：標記同一次進站的所有動作，也讓一小時後的再次造訪成為另一筆 session
  state.sessionId = (self.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : (Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10));
  trackClick("進入", "", "");   // 記錄進站
  await loadEventTypes();
  show("screen-booking");
  hide("screen-loading");
}

/* ── 載入方案 ── */
async function loadEventTypes() {
  var data = await apiGet({ action: "eventTypes" });
  state.eventTypes = data.eventTypes || [];
  // 從第一個方案取得真實 username（含後綴）
  if (state.eventTypes.length > 0 && state.eventTypes[0].realUsername) {
    state.realUsername = state.eventTypes[0].realUsername;
  }
  renderPlanList();
}

/* ══════════════════════════════════════════════
   加購邏輯
   加購清單來自 Cal.com 各方案的 Description，格式：

     服務說明文字...

     [加購]
     牛角加強|30|700|請於現場告知加強部位
     牛角眼額|10|200|

   欄位：名稱|加時(分鐘)|加價(元)|備註(可留空)
   由後端 cal.js 解析後，放在 et.addons
   ══════════════════════════════════════════════ */

/* ── 渲染方案列表 ── */
function renderPlanList() {
  var container = document.getElementById("plan-list");
  if (!state.eventTypes.length) {
    container.innerHTML = '<div style="text-align:center;padding:32px;color:var(--ink-light);font-size:14px;">目前沒有可預約的方案</div>';
    return;
  }
  container.innerHTML = state.eventTypes.map(function(et) {
    var addons = et.addons || [];

    // 加購區塊（預設隱藏，選了該方案才顯示）
    var addonHtml = "";
    if (addons.length > 0) {
      addonHtml = '<div class="addon-area" id="addon-area-' + et.id + '" style="display:none">' +
        '<div class="addon-label">加購選項（可選一項）</div>' +
        addons.map(function(ad, idx) {
          var meta = "+" + ad.minutes + "min";
          if (ad.price > 0) meta += " +" + ad.price + "元";
          return '<div class="addon-btn" id="addon-' + et.id + '-' + idx + '" ' +
                 'onclick="event.stopPropagation(); toggleAddon(' + et.id + ',' + idx + ')">' +
                 '<span class="addon-btn-check"></span>' +
                 '<span class="addon-btn-name">' + esc(ad.name) + '</span>' +
                 '<span class="addon-btn-meta">' + meta + '</span>' +
                 '</div>';
        }).join('') +
        '<div class="addon-total" id="addon-total-' + et.id + '"></div>' +
        '<div class="addon-notes" id="addon-notes-' + et.id + '"></div>' +
      '</div>';
    }

    return '<div class="plan-item" onclick="selectPlan(' + et.id + ')" id="plan-' + et.id + '">' +
      '<div class="plan-item-header">' +
        '<div class="plan-name">' + esc(et.title) +
          (et.basePrice > 0 ? '<span class="plan-price">' + et.basePrice + ' 元</span>' : '') +
        '</div>' +
        '<div class="plan-duration">' + et.length + ' 分鐘</div>' +
        '<div class="plan-check">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
        '</div>' +
      '</div>' +
      (et.description ? '<div class="plan-desc">' + esc(et.description) + '</div>' : '') +
      addonHtml +
    '</div>';
  }).join('');
}

/* ── 選擇方案 ── */
function selectPlan(id) {
  var plan = state.eventTypes.find(function(e) { return e.id === id; });
  if (!plan) return;

  state.selectedPlan = plan;
  state.selectedAddons = [];   // 換方案時清空加購

  // 追蹤：點方案
  trackClick("方案", plan.title, "");

  // UI 高亮
  document.querySelectorAll('.plan-item').forEach(function(el) { el.classList.remove('selected'); });
  document.getElementById('plan-' + id).classList.add('selected');

  // 清空所有加購勾選
  document.querySelectorAll('.addon-btn').forEach(function(el) { el.classList.remove('selected'); });

  // 只顯示這個方案的加購區
  document.querySelectorAll('.addon-area').forEach(function(el) { el.style.display = "none"; });
  var area = document.getElementById('addon-area-' + id);
  if (area) area.style.display = "block";

  updateAddonSummary();
  resetDateTime();

  var calSection = document.getElementById("calendar-section");
  calSection.style.display = "block";
  initCalendar();
  // 不自動捲動：讓顧客自行決定是否加購、確認選擇

  updateNextBtn();
}

/* ── 選擇 / 取消加購（單選，再點一次取消）── */
function toggleAddon(planId, addonIdx) {
  var plan = state.eventTypes.find(function(e) { return e.id === planId; });
  if (!plan || !plan.addons || !plan.addons[addonIdx]) return;
  var addon = plan.addons[addonIdx];

  var btn = document.getElementById('addon-' + planId + '-' + addonIdx);
  var already = state.selectedAddons.length > 0 && state.selectedAddons[0].name === addon.name;

  // 先清空目前選取（單選：一次只能有一個加購）
  state.selectedAddons = [];
  document.querySelectorAll('#addon-area-' + planId + ' .addon-btn').forEach(function(el) {
    el.classList.remove('selected');
  });

  if (!already) {
    // 選這個加購
    state.selectedAddons = [addon];
    btn.classList.add('selected');
    // 追蹤：點加購
    trackClick("加購", addon.name, plan.title);
  } else {
    // 再點同一個 → 取消加購，也記錄一筆
    trackClick("取消加購", addon.name, plan.title);
  }
  // already 為真（再點同一個）→ 保持清空 = 取消加購

  updateAddonSummary();

  // 時長改變 → 重新查時段
  resetDateTime();
  initCalendar();
  updateNextBtn();
}

/* ── 計算並顯示加購後的總時長 / 總價 / 備註 ── */
function updateAddonSummary() {
  if (!state.selectedPlan) return;
  var planId = state.selectedPlan.id;

  var totalEl = document.getElementById('addon-total-' + planId);
  var notesEl = document.getElementById('addon-notes-' + planId);
  if (!totalEl) return;

  var totalMin = getTotalMinutes();
  var totalPrice = getTotalPrice();
  var extraPrice = state.selectedAddons.reduce(function(s, a) { return s + (a.price || 0); }, 0);

  var txt = '總時長 ' + totalMin + ' 分鐘';
  if (totalPrice > 0) {
    txt += '　總價 ' + totalPrice + ' 元';
    if (extraPrice > 0) txt += '（含加購 +' + extraPrice + '）';
  }
  totalEl.textContent = txt;

  // 顯示有備註的加購提醒
  var notes = state.selectedAddons.filter(function(a) { return a.note; });
  if (notes.length) {
    notesEl.innerHTML = notes.map(function(a) {
      return '<div class="addon-note-line">📌 ' + esc(a.name) + '：' + esc(a.note) + '</div>';
    }).join('');
    notesEl.style.display = "block";
  } else {
    notesEl.style.display = "none";
  }
}

/* ── 目前選擇的總時長（主服務 + 所有加購）── */
function getTotalMinutes() {
  if (!state.selectedPlan) return 0;
  var base = state.selectedPlan.length || 0;
  var extra = state.selectedAddons.reduce(function(s, a) { return s + (a.minutes || 0); }, 0);
  return base + extra;}

/* ── 目前選擇的總價（主服務原價 + 所有加購加價）── */
function getTotalPrice() {
  if (!state.selectedPlan) return 0;
  var base = state.selectedPlan.basePrice || 0;
  var extra = state.selectedAddons.reduce(function(s, a) { return s + (a.price || 0); }, 0);
  return base + extra;
}

/* ── 加購名稱字串（給通知與摘要用）── */
function getAddonNames() {
  return state.selectedAddons.map(function(a) { return a.name; }).join("、");
}

/* ── 清空日期時段選擇 ── */
function resetDateTime() {
  state.selectedDate = "";
  state.selectedSlot = "";
  state.selectedSlotIso = "";
  state.slotsCache = {};
  hide("slot-card");
}

/* ── 步驟導航 ── */
function goNext() {
  if (state.step === 1) {
    // 步驟一：方案+時段都選好才能繼續
    if (!state.selectedPlan || !state.selectedSlotIso) return;
    goStep(2);
    renderSummary();
  } else if (state.step === 2) {
    submitBooking();
  }
}

function goPrev() {
  if (state.step === 2) goStep(1);
}

function goStep(n) {
  hide("step-" + state.step);
  state.step = n;
  show("step-" + n);
  updateStepUI();
  updateNextBtn();
  window.scrollTo(0, 0);
}

function updateStepUI() {
  [1,2].forEach(function(i) {
    var dot = document.getElementById("dot-" + i);
    var label = document.getElementById("label-" + i);
    dot.className = "step-dot" + (i === state.step ? " active" : i < state.step ? " done" : "");
    label.className = "step-label" + (i === state.step ? " active" : "");
  });
  document.getElementById("line-1").className = "step-line" + (state.step > 1 ? " done" : "");
  var backBtn = document.getElementById("btn-back");
  backBtn.style.display = state.step > 1 ? "block" : "none";
}

function updateNextBtn() {
  var btn = document.getElementById("btn-next");
  var textEl = btn.querySelector(".btn-text");
  if (state.step === 1) {
    textEl.textContent = "填寫資料 →";
    // 需要方案和時段都選好才能點
    btn.disabled = !(state.selectedPlan && state.selectedSlotIso);
  } else {
    textEl.textContent = "確認預約";
    btn.disabled = false;
  }
}

/* ── 日曆 ── */
function initCalendar() {
  var now = new Date();
  state.calendarYear = now.getFullYear();
  state.calendarMonth = now.getMonth();
  state.selectedDate = "";
  state.selectedSlot = "";
  state.selectedSlotIso = "";
  hide("slot-card");
  renderCalendar();
  fetchMonthSlots(state.calendarYear, state.calendarMonth);
}

function changeMonth(delta) {
  state.calendarMonth += delta;
  if (state.calendarMonth < 0)  { state.calendarMonth = 11; state.calendarYear--; }
  if (state.calendarMonth > 11) { state.calendarMonth = 0;  state.calendarYear++; }
  state.selectedDate = "";
  state.selectedSlot = "";
  state.selectedSlotIso = "";
  hide("slot-card");
  renderCalendar();
  fetchMonthSlots(state.calendarYear, state.calendarMonth);
}

function renderCalendar() {
  var yr = state.calendarYear, mo = state.calendarMonth;
  document.getElementById("cal-month-label").textContent =
    yr + " 年 " + (mo + 1) + " 月";

  // 前後月控制
  var now = new Date(); now.setDate(1); now.setHours(0,0,0,0);
  var thisYm = now.getFullYear() * 12 + now.getMonth();
  var viewYm = yr * 12 + mo;
  document.getElementById("btn-prev-month").disabled = (viewYm <= thisYm);

  var firstDay = new Date(yr, mo, 1).getDay(); // 0=Sun
  var daysInMonth = new Date(yr, mo + 1, 0).getDate();
  var key = yr + "-" + pad2(mo + 1);
  var slotsData = state.slotsCache[key] || null;

  var grid = document.getElementById("cal-grid");
  var cells = "";

  // 補空格
  for (var i = 0; i < firstDay; i++) {
    cells += '<div class="cal-day empty"></div>';
  }

  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = yr + "-" + pad2(mo + 1) + "-" + pad2(d);
    var dayOfWeek = new Date(yr, mo, d).getDay();
    var dateObj = new Date(yr, mo, d);
    dateObj.setHours(0,0,0,0);

    var cls = "cal-day";
    if (dayOfWeek === 0) cls += " cal-sunday";
    if (dayOfWeek === 6) cls += " cal-saturday";

    var isToday = (dateObj.getTime() === TODAY.getTime());
    if (isToday) cls += " today";

    if (dateObj < TODAY) {
      cls += " past";
      cells += '<div class="' + cls + '">' + d + '</div>';
      continue;
    }

    if (slotsData === null) {
      // 還在載入，暫時顯示為可點
      cls += " has-slot";
    } else {
      var hasSlot = slotsData[dateStr] && slotsData[dateStr].length > 0;
      cls += hasSlot ? " has-slot" : " no-slot";
    }

    if (state.selectedDate === dateStr) cls += " selected";

    cells += '<div class="' + cls + '" onclick="selectDate(\'' + dateStr + '\')">' + d + '</div>';
  }

  grid.innerHTML = cells;
}

async function fetchMonthSlots(yr, mo) {
  var key = yr + "-" + pad2(mo + 1);
  if (state.slotsCache[key]) { renderCalendar(); return; }

  // 設 loading 狀態
  state.slotsCache[key] = null;

  var startTime = new Date(yr, mo, 1).toISOString();
  var endTime   = new Date(yr, mo + 1, 0, 23, 59, 59).toISOString();

  try {
    var slotQuery = {
      action: "slots",
      eventTypeId: state.selectedPlan.id,
      startTime: startTime,
      endTime: endTime
    };
    // 有加購才帶 duration（沒加購用方案原始時長，不需指定）
    var totalMin = getTotalMinutes();
    if (state.selectedAddons.length > 0 && totalMin !== state.selectedPlan.length) {
      slotQuery.duration = totalMin;
    }
    var data = await apiGet(slotQuery);

    // Cal.com v2 slots 回傳格式：{ data: { "YYYY-MM-DD": [{start: ISO},...] }, status: "success" }
    var raw = (data.data && typeof data.data === "object") ? data.data : (data.slots || {});
    var parsed = {};
    Object.keys(raw).forEach(function(dateKey) {
      // dateKey 格式 "2026-05-12" 或 "2026-05-12T00:00:00.000Z"，取前10碼
      var dk = dateKey.substring(0, 10);
      parsed[dk] = raw[dateKey].map(function(slot) {
        // 2024-09-04 版回傳 slot.start，舊版回傳 slot.time，兩者相容
        var isoStr = slot.start || slot.time;
        var d = new Date(isoStr);
        // 轉台灣時間（UTC+8）
        var totalMins = d.getUTCHours() * 60 + d.getUTCMinutes() + 480;
        var hh = String(Math.floor(totalMins / 60) % 24).padStart(2, "0");
        var mm = String(totalMins % 60).padStart(2, "0");
        return { display: hh + ":" + mm, iso: isoStr };
      });
    });
    state.slotsCache[key] = parsed;
  } catch(err) {
    console.error("Slots error:", err);
    state.slotsCache[key] = {};
  }
  renderCalendar();
}

function selectDate(dateStr) {
  state.selectedDate = dateStr;
  state.selectedSlot = "";
  state.selectedSlotIso = "";
  updateNextBtn();
  renderCalendar();

  var key = dateStr.substring(0, 7);
  var slotsData = state.slotsCache[key] || {};
  var slots = slotsData[dateStr] || [];
  renderSlots(dateStr, slots);
}

function renderSlots(dateStr, slots) {
  var card = document.getElementById("slot-card");
  var grid = document.getElementById("slot-grid");

  // 標題：YYYY年MM月DD日 (週X)
  var d = new Date(dateStr + "T00:00:00");
  var weekNames = ["日","一","二","三","四","五","六"];
  var label = (d.getFullYear()) + " 年 " + (d.getMonth()+1) + " 月 " + d.getDate() + " 日（週" + weekNames[d.getDay()] + "）";
  document.getElementById("slot-date-label").textContent = label;

  if (!slots.length) {
    grid.innerHTML = '<div class="slot-empty">此日期無可用時段</div>';
  } else {
    grid.innerHTML = slots.map(function(slot) {
      var sel = state.selectedSlot === slot.display ? " selected" : "";
      return '<div class="slot-btn' + sel + '" onclick="selectSlot(\'' + slot.display + '\',\'' + slot.iso + '\')">' + slot.display + '</div>';
    }).join('');
  }

  card.style.display = "block";
  card.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function selectSlot(display, iso) {
  state.selectedSlot = display;
  state.selectedSlotIso = iso;
  document.querySelectorAll('.slot-btn').forEach(function(el) { el.classList.remove('selected'); });
  event.currentTarget.classList.add('selected');
  updateNextBtn();
}

/* ── 摘要 ── */
function renderSummary() {
  var d = new Date(state.selectedDate + "T00:00:00");
  var weekNames = ["日","一","二","三","四","五","六"];
  var dateLabel = (d.getMonth()+1) + "/" + d.getDate() + "（週" + weekNames[d.getDay()] + "）" + state.selectedSlot;

  var planTxt = state.selectedPlan.title;
  var addonNames = getAddonNames();
  if (addonNames) planTxt += "　＋ " + addonNames;

  document.getElementById("summary-plan").textContent = planTxt;
  document.getElementById("summary-datetime").textContent = dateLabel;
  var sumDur = getTotalMinutes() + " 分鐘";
  var sumPrice = getTotalPrice();
  if (sumPrice > 0) sumDur += "　" + sumPrice + " 元";
  document.getElementById("summary-duration").textContent = sumDur;
}

/* ── 送出預約 ── */
async function submitBooking() {
  var name  = document.getElementById("input-name").value.trim();
  var email = document.getElementById("input-email").value.trim();
  var phone = document.getElementById("input-phone").value.trim();

  if (!name) { alert("請填寫姓名"); return; }
  if (!phone) { alert("請填寫手機號碼"); return; }
  if (email && !email.includes("@")) { alert("Email 格式不正確"); return; }

  var btn = document.getElementById("btn-next");
  btn.classList.add("loading");
  btn.disabled = true;

  try {
    // email 顧客可不填；空著時交給後端 cal.js 用 FALLBACK_EMAIL（店家自己的信箱）補上
    // 不在前端自造假 email：Cal.com 會驗證網域能不能收信，@example.com / @sms.cal.com 都會被擋
    var emailToSend = email;   // 可能為空字串，由後端處理

    // 只有選了加購（總時長 ≠ 原始時長）才送 lengthInMinutes
    // 沒加購的方案若送此欄位，Cal.com 會因「非多時長方案」拒絕
    var totalMin = getTotalMinutes();
    var bookingData = {
      action: "createBooking",
      eventTypeId: state.selectedPlan.id,
      startTime: state.selectedSlotIso,
      name: name,
      email: emailToSend,
      phone: phone || undefined,
      lineUserId: state.lineUserId,
      timeZone: "Asia/Taipei",
      language: "zh-TW",
      addons: getAddonNames(),
      totalPrice: state.selectedAddons.reduce(function(s, a) { return s + (a.price || 0); }, 0)
    };

    // 有加購才帶時長（總時長大於原始時長時）
    if (state.selectedAddons.length > 0 && totalMin !== state.selectedPlan.length) {
      bookingData.lengthInMinutes = totalMin;
    }

    var result = await apiPost(bookingData);

    // 顯示成功畫面
    var d = new Date(state.selectedDate + "T00:00:00");
    var weekNames = ["日","一","二","三","四","五","六"];
    var dateLabel = (d.getMonth()+1) + "/" + d.getDate() + "（週" + weekNames[d.getDay()] + "）" + state.selectedSlot;

    var sucPlanTxt = state.selectedPlan.title;
    var sucAddons = getAddonNames();
    if (sucAddons) sucPlanTxt += "　＋ " + sucAddons;

    document.getElementById("suc-plan").textContent = sucPlanTxt;
    document.getElementById("suc-datetime").textContent = dateLabel;
    var sucDur = getTotalMinutes() + " 分鐘";
    var sucPrice = getTotalPrice();
    if (sucPrice > 0) sucDur += "　" + sucPrice + " 元";
    document.getElementById("suc-duration").textContent = sucDur;
    document.getElementById("suc-name").textContent = name;

    hide("screen-booking");
    show("screen-success");

    // 返回鍵 → 關閉
    history.pushState(null, "", location.href);
    window.addEventListener("popstate", function() { closeWindow(); });

  } catch(err) {
    console.error("Booking error:", err);
    // 顯示完整錯誤內容方便除錯
    var msg = err.message || "未知錯誤";
    try {
      var errData = JSON.parse(msg);
      msg = JSON.stringify(errData, null, 2);
    } catch(e) {}
    alert("預約失敗：\n" + msg);
    btn.classList.remove("loading");
    btn.disabled = false;
  }
}

/* ── 關閉視窗 ── */
function closeWindow() {
  if (typeof liff !== "undefined" && liff.isInClient()) {
    liff.closeWindow();
  } else {
    window.close();
  }
}

/* ── 工具 ── */
function show(id) {
  var el = document.getElementById(id);
  if (!el) return;
  if (id.startsWith("screen-") || id === "screen-booking") {
    el.style.display = "flex";
  } else {
    el.style.display = "block";
  }
}
function hide(id) {
  var el = document.getElementById(id);
  if (el) el.style.display = "none";
}
function pad2(n) { return String(n).padStart(2, "0"); }
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ── LIFF SDK 載入 ── */
function loadLiffSdk() {
  return new Promise(function(resolve, reject) {
    // 已載入
    if (typeof liff !== "undefined") { resolve(); return; }

    var s = document.createElement("script");
    s.src = "https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js";
    s.crossOrigin = "anonymous";

    s.onload = function() {
      // 確認 liff 物件確實存在
      var tries = 0;
      var check = setInterval(function() {
        tries++;
        if (typeof liff !== "undefined") {
          clearInterval(check);
          resolve();
        } else if (tries > 20) {
          clearInterval(check);
          reject(new Error("LIFF SDK 載入後無法初始化"));
        }
      }, 100);
    };

    s.onerror = function() {
      reject(new Error("LIFF SDK 載入失敗，請確認網路連線後重試"));
    };

    document.head.appendChild(s);
  });
}

/* ── 啟動 ── */
(async function() {
  try {
    await loadLiffSdk();
    await init();
  } catch(err) {
    console.error("Startup error:", err);
    document.getElementById("error-msg").textContent = err.message;
    document.getElementById("screen-loading").style.display = "none";
    document.getElementById("screen-error").style.display = "flex";
  }
})();
</script>
